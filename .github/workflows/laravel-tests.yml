name: Laravel Tests

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      php-extensions:
        required: false
        type: string
        default: '[]'
      extensions:
        required: false
        type: string
        default: '[]'
      generate-key:
        required: false
        type: boolean
        default: true
      database:
        description: 'Start the MariaDB bundled in the laravel-ci image (host "mysql", user root, password test, database test).'
        required: false
        type: boolean
        default: true
      test-command:
        required: false
        type: string
        default: 'php artisan test'

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  laravel-tests:
    runs-on: [ "self-hosted", "brokkr"]
    container:
      image: ghcr.io/etsvthor/laravel-ci:${{ inputs.php-version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install extensions
        if: ${{ inputs.extensions != '[]' || inputs.php-extensions != '[]' }}
        env:
          EXTENSIONS: ${{ join(fromJSON(inputs.extensions), ' ') }}
          PHP_EXTENSIONS: ${{ join(fromJSON(inputs.php-extensions), ' ') }}
          PHP_VERSION: ${{ inputs.php-version }}
        run: |
          # The laravel-ci image already ships the common extensions; only install what is missing.
          missing=""
          for package in $EXTENSIONS; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          for extension in $PHP_EXTENSIONS; do
            php -m | grep -qix "$extension" || missing="$missing php$PHP_VERSION-$extension"
          done
          if [ -n "$missing" ]; then
            apt-get update --allow-releaseinfo-change
            apt-get install -y $missing
          fi
      - name: Start database
        if: ${{ inputs.database }}
        run: ci-db-start
      - uses: actions/checkout@v7
      - name: Copy .env.ci to .env
        run: php -r "file_exists('.env') || copy('.env.ci', '.env');"
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', '*/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        if: ${{ inputs.generate-key }}
        run: php artisan key:generate
      - name: Execute tests
        run: ${{ inputs.test-command }}
