name: Laravel Static Analysis

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      php-extensions:
        required: false
        type: string
        default: '[]'
      extensions:
        required: false
        type: string
        default: '[]'

jobs:
  laravel-code-style:
    runs-on: [ "self-hosted", "brokkr"]

    steps:
      - name: Update repositories
        run: sudo apt-get update
      - name: Install extensions
        if: ${{ inputs.extensions != '[]' }}
        run: |
          sudo apt install ${{ join(fromJSON(inputs.extensions), ' ') }} -y
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      - name: Installing dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ inputs.php-version }}
          php_extensions: ${{ join(fromJSON(inputs.extensions), ' ') }}
      - name: Copy .env.ci to .env
        run: php -r "file_exists('.env') || copy('.env.ci', '.env');"
      - name: Execute PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix app --dry-run --diff
