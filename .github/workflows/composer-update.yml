name: "Composer update"

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      php-extensions:
        required: false
        type: string
        default: '[]'
      extensions:
        required: false
        type: string
        default: '[]'
    secrets:
      COMPOSER_UPDATE_TOKEN:
        required: true

jobs:
  composer-update:
    runs-on: [ "self-hosted", "brokkr"]
    container:
      image: kirschbaumdevelopment/laravel-test-runner:${{ inputs.php-version }}

    steps:
      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d_%H_%M')" >> $GITHUB_OUTPUT
      - name: Update repositories
        run: apt-get update --allow-releaseinfo-change
      - name: Install extensions
        if: ${{ inputs.extensions != '[]' }}
        run: |
          apt-get install ${{ join(fromJSON(inputs.extensions), ' ') }} -y
      - name: Install PHP extensions
        if: ${{ inputs.php-extensions != '[]' }}
        run: |
          apt-get install php${{ inputs.php-version }}-${{ join(fromJSON(inputs.php-extensions), format(' php{0}-', inputs.php-version)) }} -y
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Update dependencies
        id: composer-update
        run: |
          {
            echo 'update<<EOF'
            composer update --prefer-stable --prefer-dist --no-interaction --no-ansi 2>&1 > /dev/null
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "[CI] Composer update ${{ steps.date.outputs.date }}"
          commit-message: "[CI] composer update"
          body: "${{ steps.composer-update.outputs.update }}"
          branch: "composer-update-${{ steps.date.outputs.datetime }}"
          #token: "${{ secrets.COMPOSER_UPDATE_TOKEN }}"
          reviewers: niekbr
          team-reviewers: WebCo
