name: "Composer update"

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      php-extensions:
        required: false
        type: string
        default: '[]'
      extensions:
        required: false
        type: string
        default: '[]'
    secrets:
      COMPOSER_UPDATE_TOKEN:
        required: true

jobs:
  composer-update:
    runs-on: [ "self-hosted", "brokkr"]
    container:
      image: kirschbaumdevelopment/laravel-test-runner:${{ inputs.php-version }}

    steps:
      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d_%H_%M')" >> $GITHUB_OUTPUT
      - name: Update repositories
        run: apt-get update --allow-releaseinfo-change
      - name: Install extensions
        if: ${{ inputs.extensions != '[]' }}
        run: |
          apt-get install ${{ join(fromJSON(inputs.extensions), ' ') }} -y
      - name: Install PHP extensions
        if: ${{ inputs.php-extensions != '[]' }}
        run: |
          apt-get install php${{ inputs.php-version }}-${{ join(fromJSON(inputs.php-extensions), format(' php{0}-', inputs.php-version)) }} -y
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Run composer update and capture output
        id: composer-update
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-ansi 2>&1 | tee /tmp/output.txt)
      - name: Save updated Composer cache
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        id: pull-request
        with:
          title: "[CI] Composer update ${{ steps.date.outputs.date }}"
          commit-message: "[CI] composer update"
          body-path: /tmp/output.txt
          branch: "composer-update-${{ steps.date.outputs.datetime }}"
          token: "${{ secrets.COMPOSER_UPDATE_TOKEN }}"
          reviewers: niekbr
          team-reviewers: WebCo
      - name: Check outputs
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.pull-request.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.pull-request.outputs.pull-request-url }}"
      - name: Enable auto-merge via GraphQL
        env:
          GH_TOKEN: ${{ secrets.COMPOSER_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo "$REPO" | cut -d'/' -f2)
      
          echo "Fetching PR node ID..."
          RESPONSE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -X POST -d "{\"query\":\"query { repository(owner: \\\"$OWNER\\\", name: \\\"$NAME\\\") { pullRequest(number: $PR_NUMBER) { id } } }\"}" \
            https://api.github.com/graphql)
      
          # Extract PR ID using shell-safe pattern (no jq)
          PR_ID=$(echo "$RESPONSE" | grep -oE '"id" ?: ?"[^"]+"' | head -1 | cut -d'"' -f4)
      
          if [ -z "$PR_ID" ]; then
            echo "Failed to fetch PR ID. Response:"
            echo "$RESPONSE"
            exit 1
          fi
      
          echo "PR_ID=$PR_ID"
      
          echo "Enabling auto-merge..."
          curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"query\":\"mutation { enablePullRequestAutoMerge(input: { pullRequestId: \\\"$PR_ID\\\", mergeMethod: SQUASH }) { pullRequest { number autoMergeRequest { enabledAt enabledBy { login } } } } }\"}"
